<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeadPredictor</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <h1>LeadPredictor</h1>

            <label for="language">Language</label>
            <select id="language">
                <option>English</option>
            </select>

            <label for="currency">Currency</label>
            <select id="currency">
                <option>$ US Dollar</option>
            </select>

            <label for="startDate">Campaign Start</label>
            <input type="date" id="startDate">

            <label for="endDate">Campaign End</label>
            <input type="date" id="endDate">

            <label for="revenue">Total Revenue</label>
            <input type="number" id="revenue" value="10000">

            <label for="orderValue">Avg. Order Value</label>
            <input type="number" id="orderValue" value="1000">
        </aside>

        <main class="dashboard">
            <section class="chart-panel">
                <h2>Campaign Forecast</h2>
                <div class="chart-placeholder">
                    Chart area
                </div>
            </section>

            <section class="stats-panel">
                <div class="stat-card">
                    <h3>Prospects</h3>
                    <strong id="prospects">125</strong>
                </div>

                <div class="stat-card">
                    <h3>Leads</h3>
                    <strong id="leads">25</strong>
                </div>

                <div class="stat-card">
                    <h3>Customers</h3>
                    <strong id="customers">10</strong>
                </div>
            </section>

            <section class="sliders">
                <label for="leadRate">Lead Response Rate</label>
                <input type="range" id="leadRate" min="1" max="100" value="40">

                <label for="prospectRate">Prospect Response Rate</label>
                <input type="range" id="prospectRate" min="1" max="100" value="20">
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
